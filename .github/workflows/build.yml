          cat > 'app/src/main/java/com/josh/frogweather/MainActivity.java' <<'EOF_FILE'
          package com.josh.frogweather;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import java.net.URISyntaxException;

          public class MainActivity extends Activity {

              // Served from a fake https origin so localStorage, geolocation, clipboard etc. behave like a real site
              private static final String HOST = "appassets.androidplatform.net";
              // fs=0 tells the page not to call requestFullscreen — the app is already fullscreen
              private static final String START_URL = "https://" + HOST + "/assets/index.html?fs=0";

              private static final int REQ_FILE = 1001;
              private static final int REQ_LOCATION = 1002;

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;
              private Updater updater;
              private boolean startupCheckDone = false;
              static MainActivity current;                    // for InstallReceiver

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  current = this;
                  updater = new Updater(this);

                  WebView.setWebContentsDebuggingEnabled(true); // chrome://inspect from your PC

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF000000);
                  setContentView(webView);
                  goImmersive();

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); // Node-RED + camera on http://10.1.1.x
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportMultipleWindows(false); // window.open() becomes a navigation we can hand to Android

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.addJavascriptInterface(new AppBridge(), "AndroidApp");   // version + in-app updates

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {
                          return loader.shouldInterceptRequest(req.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          if (!req.isForMainFrame()) return false;          // iframes load normally
                          Uri uri = req.getUrl();
                          if (HOST.equals(uri.getHost())) return false;     // our own page
                          openExternally(uri.toString());                   // maps, search, music, links…
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          // WebView has no Web Share API — route it to Android's share sheet
                          view.evaluateJavascript(
                              "if(!navigator.share){navigator.share=function(d){d=d||{};" +
                              "AndroidBridge.share(d.title||'',d.text||'',d.url||'');return Promise.resolve();};}",
                              null);
                          // quietly look for a new build once per launch
                          if (!startupCheckDone) {
                              startupCheckDone = true;
                              view.postDelayed(() -> updater.check(true), 3000);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (hasLocationPermission()) {
                              cb.invoke(origin, true, true);
                          } else {
                              geoOrigin = origin;
                              geoCallback = cb;
                              requestPermissions(new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
              }

              private void openExternally(String url) {
                  try {
                      Intent i = url.startsWith("intent:")
                              ? Intent.parseUri(url, Intent.URI_INTENT_SCHEME)
                              : new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (ActivityNotFoundException | URISyntaxException ignored) { }
              }

              private void goImmersive() {
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  if (Build.VERSION.SDK_INT >= 30) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.systemBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) goImmersive();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (code == REQ_LOCATION && geoCallback != null) {
                      geoCallback.invoke(geoOrigin, hasLocationPermission(), true);
                      geoCallback = null;
                  }
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  super.onActivityResult(code, result, data);
                  if (code == REQ_FILE && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result, data));
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else moveTaskToBack(true); // keep the page alive instead of killing it
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  webView.saveState(out);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
                  webView.resumeTimers();
              }

              @Override
              protected void onPause() {
                  webView.onPause();
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (current == this) current = null;
                  webView.destroy();
                  super.onDestroy();
              }

              /** Calls window.onAppUpdate(json) in the page. */
              void sendUpdateState(String json) {
                  runOnUiThread(() -> {
                      if (webView != null) webView.evaluateJavascript("window.onAppUpdate && window.onAppUpdate(" + json + ")", null);
                  });
              }

              /** window.AndroidApp.* — the same calls as the Movies & TV app (Settings → App in the page). */
              private class AppBridge {
                  @JavascriptInterface
                  public String appVersion() { return BuildConfig.VERSION_NAME; }

                  @JavascriptInterface
                  public void checkUpdate() { updater.check(false); }

                  @JavascriptInterface
                  public void installUpdate() { updater.install(); }

                  @JavascriptInterface
                  public void openUrl(String url) {
                      if (url == null || url.isEmpty()) return;
                      runOnUiThread(() -> openExternally(url));
                  }

                  @JavascriptInterface
                  public void share(String title, String url) {
                      new Bridge().share(title == null ? "" : title, "", url == null ? "" : url);
                  }
              }

              private class Bridge {
                  @JavascriptInterface
                  public void share(String title, String text, String url) {
                      String body = text.isEmpty() ? url : (url.isEmpty() ? text : text + "\n" + url);
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_SUBJECT, title);
                      send.putExtra(Intent.EXTRA_TEXT, body);
                      Intent chooser = Intent.createChooser(send, title.isEmpty() ? "Share" : title);
                      chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      runOnUiThread(() -> startActivity(chooser));
                  }
              }
          }
          EOF_FILE
          cat > 'app/src/main/java/com/josh/frogweather/Updater.java' <<'EOF_FILE'
          package com.josh.frogweather;

          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageInstaller;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.time.Instant;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * In-app updates (same as the Movies & TV app): checks the repo's latest GitHub Release,
           * downloads its APK inside the app and hands it to Android's installer.
           * Reports progress to the page as window.onAppUpdate({ state, ... }).
           *
           * "Newer" = the release tag's build number (v<version>-<build>) is higher than this
           * build's versionCode (the GitHub run number). Tags without one fall back to the upload time.
           * A public repo needs no token; a private one needs the UPDATE_TOKEN repository secret.
           */
          final class Updater {

              private static final String API = "https://api.github.com/repos/";
              private static final Pattern BUILD = Pattern.compile("-(\\d+)$");
              private final MainActivity act;
              private volatile boolean busy = false;
              private String assetUrl;          // API url of the APK in the latest release
              private String latestVersion = "";

              Updater(MainActivity act) { this.act = act; }

              private boolean configured() { return !BuildConfig.UPDATE_REPO.isEmpty(); }

              // ── Check ──────────────────────────────────────────────────────────────
              void check(boolean quiet) {
                  if (!configured()) { send(state("off", "quiet", quiet)); return; }
                  if (busy) return;
                  busy = true;
                  if (!quiet) send(state("checking"));
                  new Thread(() -> {
                      try {
                          JSONObject rel = new JSONObject(new String(get(API + BuildConfig.UPDATE_REPO + "/releases/latest"), "UTF-8"));
                          String tag = rel.optString("tag_name", "").replaceFirst("^v", "");
                          Matcher m = BUILD.matcher(tag);
                          long build = m.find() ? Long.parseLong(m.group(1)) : -1;
                          latestVersion = build >= 0 ? tag.substring(0, m.start()) : tag;
                          JSONArray assets = rel.optJSONArray("assets");
                          JSONObject apk = null;
                          if (assets != null) for (int i = 0; i < assets.length(); i++) {
                              JSONObject a = assets.getJSONObject(i);
                              if (a.optString("name").endsWith(".apk")) { apk = a; break; }
                          }
                          if (apk == null) { send(state("current", "version", latestVersion, "quiet", quiet)); return; }
                          assetUrl = apk.getString("url");
                          boolean newer;
                          if (build >= 0) {
                              newer = build > BuildConfig.VERSION_CODE;
                          } else {
                              long uploaded = Instant.parse(apk.getString("updated_at")).toEpochMilli();
                              PackageInfo me = act.getPackageManager().getPackageInfo(act.getPackageName(), 0);
                              newer = uploaded > me.lastUpdateTime + 60_000;
                          }
                          send(state(newer ? "available" : "current", "version", latestVersion, "quiet", quiet));
                      } catch (Exception e) {
                          send(state("error", "message", reason(e), "quiet", quiet));
                      } finally {
                          busy = false;
                      }
                  }).start();
              }

              // ── Download + install ─────────────────────────────────────────────────
              void install() {
                  if (busy) return;
                  if (assetUrl == null) { check(false); return; }
                  if (!act.getPackageManager().canRequestPackageInstalls()) {
                      // First time: Android needs "Install unknown apps" switched on for this app
                      act.runOnUiThread(() -> act.startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + act.getPackageName()))));
                      send(state("permission"));
                      return;
                  }
                  busy = true;
                  new Thread(() -> {
                      try {
                          File apk = download();
                          send(state("installing", "version", latestVersion));
                          installApk(apk);
                      } catch (Exception e) {
                          send(state("failed", "message", reason(e)));
                      } finally {
                          busy = false;
                      }
                  }).start();
              }

              private File download() throws Exception {
                  send(state("downloading", "pct", 0));
                  // GitHub answers with a redirect to a signed download link, which is fetched without the token
                  HttpURLConnection c = open(assetUrl, "application/octet-stream");
                  c.setInstanceFollowRedirects(false);
                  int code = c.getResponseCode();
                  if (code == 301 || code == 302 || code == 307) {
                      String loc = c.getHeaderField("Location");
                      c.disconnect();
                      c = (HttpURLConnection) new URL(loc).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      code = c.getResponseCode();
                  }
                  if (code != 200) throw new Exception("download failed (HTTP " + code + ")");
                  long total = c.getContentLengthLong();
                  File out = new File(act.getCacheDir(), "update.apk");
                  try (InputStream in = c.getInputStream(); OutputStream os = new FileOutputStream(out)) {
                      byte[] buf = new byte[64 * 1024];
                      long done = 0; int n, lastPct = -1;
                      while ((n = in.read(buf)) > 0) {
                          os.write(buf, 0, n);
                          done += n;
                          if (total > 0) {
                              int pct = (int) (done * 100 / total);
                              if (pct != lastPct && pct % 5 == 0) { lastPct = pct; send(state("downloading", "pct", pct)); }
                          }
                      }
                  } finally {
                      c.disconnect();
                  }
                  return out;
              }

              private void installApk(File apk) throws Exception {
                  PackageInstaller pi = act.getPackageManager().getPackageInstaller();
                  PackageInstaller.SessionParams params = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                  if (Build.VERSION.SDK_INT >= 31) {
                      // later updates can go through without a prompt once this app installed the current one
                      params.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED);
                  }
                  int id = pi.createSession(params);
                  try (PackageInstaller.Session session = pi.openSession(id)) {
                      try (InputStream in = new FileInputStream(apk);
                           OutputStream os = session.openWrite("update.apk", 0, apk.length())) {
                          byte[] buf = new byte[64 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                          session.fsync(os);
                      }
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
                      PendingIntent done = PendingIntent.getBroadcast(act, id, new Intent(act, InstallReceiver.class), flags);
                      session.commit(done.getIntentSender());
                  }
              }

              // ── Helpers ────────────────────────────────────────────────────────────
              private HttpURLConnection open(String url, String accept) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  if (!BuildConfig.UPDATE_TOKEN.isEmpty()) c.setRequestProperty("Authorization", "Bearer " + BuildConfig.UPDATE_TOKEN);
                  c.setRequestProperty("Accept", accept);
                  c.setRequestProperty("User-Agent", "HomeApp-Updater");
                  c.setRequestProperty("X-GitHub-Api-Version", "2022-11-28");
                  return c;
              }

              private byte[] get(String url) throws Exception {
                  HttpURLConnection c = open(url, "application/vnd.github+json");
                  try {
                      int code = c.getResponseCode();
                      if (code == 401) throw new Exception("GitHub rejected the token (expired?)");
                      if (code == 403) throw new Exception("GitHub limit reached, try again in an hour");
                      if (code == 404) throw new Exception("no release found (a private repo needs the UPDATE_TOKEN secret)");
                      if (code != 200) throw new Exception("GitHub answered HTTP " + code);
                      try (InputStream in = c.getInputStream()) {
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[16 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                          return bo.toByteArray();
                      }
                  } finally {
                      c.disconnect();
                  }
              }

              private static String reason(Exception e) {
                  String m = e.getMessage();
                  if (e instanceof java.net.UnknownHostException) return "no internet connection";
                  return m == null || m.isEmpty() ? e.getClass().getSimpleName() : m;
              }

              /** state("available", "version", "2.9.5.2-1-21", "quiet", true) → {"state":"available","installed":"2.9.5.2-1-20",...} */
              private static JSONObject state(String s, Object... kv) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("state", s).put("installed", BuildConfig.VERSION_NAME);
                      for (int i = 0; i + 1 < kv.length; i += 2) o.put((String) kv[i], kv[i + 1]);
                  } catch (Exception ignored) { }
                  return o;
              }

              private void send(JSONObject o) { act.sendUpdateState(o.toString()); }
          }
          EOF_FILE
          cat > 'app/src/main/java/com/josh/frogweather/InstallReceiver.java' <<'EOF_FILE'
          package com.josh.frogweather;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;

          import org.json.JSONObject;

          /** Gets the result of installing an update: shows Android's confirm screen, or reports a failure. */
          public class InstallReceiver extends BroadcastReceiver {
              @Override
              @SuppressWarnings("deprecation")
              public void onReceive(Context ctx, Intent intent) {
                  int status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = intent.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(confirm);
                      }
                      return;
                  }
                  if (status == PackageInstaller.STATUS_SUCCESS) return;   // the app restarts on the new version
                  MainActivity a = MainActivity.current;
                  if (a == null) return;
                  String msg = intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                  if (status == PackageInstaller.STATUS_FAILURE_ABORTED) msg = "cancelled";
                  try {
                      JSONObject o = new JSONObject().put("state", "failed").put("message", msg == null ? "install failed" : msg)
                              .put("installed", BuildConfig.VERSION_NAME);
                      a.sendUpdateState(o.toString());
                  } catch (Exception ignored) { }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/assets
          cp "../$HTML_FILE" app/src/main/assets/index.html
          # stamp this build's number/version into the page so it can check GitHub for a newer one
          sed -i "s/__APP_BUILD__/$GITHUB_RUN_NUMBER/g; s/__APP_VERSION__/$APP_VERSION_NAME/g" app/src/main/assets/index.html
          # bundle the repo's image folders into the APK and point the HTML at them,
          # so images still load when the repo is private (and work offline)
          for d in ../*/; do
            n=$(basename "$d")
            [ "$n" = "build-app" ] && continue
            echo "Bundling $n/"
            cp -r "$d" "app/src/main/assets/$n"
          done
          sed -i \
            -e 's#https://raw.githubusercontent.com/lokipoki23/home_app/refs/heads/main/#https://appassets.androidplatform.net/assets/#g' \
            -e 's#https://raw.githubusercontent.com/lokipoki23/home_app/main/#https://appassets.androidplatform.net/assets/#g' \
            app/src/main/assets/index.html
          # signing key (same every build, so updates install over the old app)
          echo '' | base64 -d > app/release.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: build-app
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp build-app/app/build/outputs/apk/release/app-release.apk "HomeApp-${{ steps.html.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeApp-${{ steps.html.outputs.version }}
          path: HomeApp-*.apk

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.html.outputs.version }}-${{ github.run_number }}
          name: Home App ${{ steps.html.outputs.version }} (build ${{ github.run_number }})
          files: HomeApp-*.apk
          make_latest: true
