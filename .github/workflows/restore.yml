# One-time helper: copies the app icon and the signing key out of the OLD build.yml
# (from before it was changed) into android/ic_bg.png.b64 and android/release.keystore.b64,
# checks both, commits them, then starts "Build APK". Run it from the Actions tab, then delete this file.

name: Restore icon and key

on:
  workflow_dispatch:

permissions:
  contents: write      # to commit the two files
  actions: write       # to start the Build APK workflow afterwards

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the old build.yml can be read

      - name: Find the old build.yml and pull out the icon and key
        run: |
          WF=.github/workflows/build.yml
          OLD=""
          # newest commit whose build.yml still had the icon inside it
          for c in $(git log --format=%H -- "$WF"); do
            if git show "$c:$WF" 2>/dev/null | grep -q "EOF_ICON"; then OLD=$c; break; fi
          done
          if [ -z "$OLD" ]; then echo "No old build.yml with the icon found"; exit 1; fi
          echo "Using build.yml from commit $OLD"
          git show "$OLD:$WF" > /tmp/old.yml
          mkdir -p android
          # icon: the lines between <<'EOF_ICON' and EOF_ICON
          awk '/<<.EOF_ICON./{on=1;next} /^[[:space:]]*EOF_ICON[[:space:]]*$/{on=0} on' /tmp/old.yml \
            | tr -d ' \r' > android/ic_bg.png.b64
          # key: the text inside echo '...' on the line that writes release.keystore
          grep "release.keystore" /tmp/old.yml | grep "echo '" | head -n 1 \
            | sed -E "s/.*echo '([^']+)'.*/\1/" > android/release.keystore.b64
          # checks: the icon must be a real PNG, the key must open with its password
          base64 -d android/ic_bg.png.b64 > /tmp/ic.png
          file /tmp/ic.png | grep -q "PNG image" || { echo "Icon didn't decode to a PNG"; exit 1; }
          base64 -d android/release.keystore.b64 > /tmp/release.keystore
          keytool -list -keystore /tmp/release.keystore -storepass frogweather -alias frog >/dev/null \
            || { echo "Key didn't open with its password"; exit 1; }
          echo "Icon: $(wc -c < /tmp/ic.png) bytes PNG · key: OK (alias frog)"

      - name: Commit the two files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/ic_bg.png.b64 android/release.keystore.b64
          git commit -m "Restore icon and signing key into android/" || echo "Files were already there"
          git push

      - name: Start Build APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
